[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["-C", "default-linker-libraries"]

[build]
target = "xtensa-esp32s3-espidf"
rustflags = ["-Z", "build-std"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
ESP_IDF_VERSION = "v5.1.3"
MCU = "esp32s3"
# esp-clang (bindgen) needs libxml2.so.2, absent on this host (only .so.16);
# the Android NDK ships a real copy. System libclang for bindgen.
LD_LIBRARY_PATH = "/home/lio/Android/Sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/lib"
LIBCLANG_PATH = "/usr/lib/x86_64-linux-gnu"
